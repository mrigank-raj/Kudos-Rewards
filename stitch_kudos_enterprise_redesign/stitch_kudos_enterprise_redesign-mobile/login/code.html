<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Kudos - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .bg-animated-gradient {
            background: linear-gradient(-45deg, #fcf8ff, #e1e0ff, #c0c1ff, #f0dbff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        .dark .bg-animated-gradient {
            background: linear-gradient(-45deg, #1b1b23, #07006c, #2c0051, #301400);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .dark .glass-panel {
            background: rgba(48, 48, 56, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }
    </style>

<body class="bg-animated-gradient min-h-screen flex items-center justify-center p-md text-on-surface antialiased transition-colors duration-300">
<div class="glass-panel w-full max-w-md rounded-xl p-xl shadow-2xl relative z-10 flex flex-col">
<!-- Brand Logo & Header -->
<div class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg text-primary dark:text-primary-fixed tracking-tight">Kudos</h1>
<p class="font-body-md text-body-md text-on-surface-variant dark:text-outline-variant mt-sm">Sign in to recognize your team.</p>
</div>
<!-- Login Form -->
<form class="space-y-md w-full">
<!-- Email Field -->
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface dark:text-surface-bright" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant text-lg">mail</span>
<input class="w-full bg-surface-container-lowest dark:bg-inverse-surface border border-outline-variant dark:border-outline rounded-lg pl-xl pr-md py-sm font-body-md text-body-md text-on-surface dark:text-surface-bright focus:border-primary dark:focus:border-primary-fixed focus:ring-2 focus:ring-primary/20 dark:focus:ring-primary-fixed/20 transition-all outline-none" id="email" name="email" placeholder="name@company.com" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface dark:text-surface-bright" for="password">Password</label>
<a class="font-label-md text-label-md text-primary dark:text-inverse-primary hover:underline transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant text-lg">lock</span>
<input class="w-full bg-surface-container-lowest dark:bg-inverse-surface border border-outline-variant dark:border-outline rounded-lg pl-xl pr-md py-sm font-body-md text-body-md text-on-surface dark:text-surface-bright focus:border-primary dark:focus:border-primary-fixed focus:ring-2 focus:ring-primary/20 dark:focus:ring-primary-fixed/20 transition-all outline-none" id="password" name="password" placeholder="••••••••" type="password">
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-md rounded-lg shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 mt-lg flex items-center justify-center gap-sm" type="button">
                Sign In
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant dark:text-outline-variant">
                Don't have an account? <a class="text-primary dark:text-inverse-primary font-label-md text-label-md hover:underline transition-all" href="#">Sign Up</a>
</p>
</div>
</div>
</body></html>
