<style>
        .glass-panel {
            background: rgba(252, 248, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

        }

<body class="bg-background text-on-background font-body-md min-h-screen overflow-hidden">
<!-- Dashboard Background (Mockup for context) -->
<div class="absolute inset-0 bg-dashboard-pattern opacity-50 z-0 pointer-events-none"></div>
<div class="absolute inset-0 z-0 p-lg hidden md:grid grid-cols-12 gap-gutter opacity-40 blur-[2px] pointer-events-none">
<div class="col-span-3">
<div class="h-64 bg-surface rounded-xl border border-outline-variant p-md"></div>
</div>
<div class="col-span-6">
<div class="h-[500px] bg-surface rounded-xl border border-outline-variant p-md mb-gutter"></div>
</div>
<div class="col-span-3">
<div class="h-48 bg-surface rounded-xl border border-outline-variant p-md"></div>
</div>
</div>
<!-- Glassmorphism Overlay Overlay -->
<div aria-hidden="true" class="fixed inset-0 z-40 bg-surface/30 backdrop-blur-md transition-opacity"></div>
<!-- Slide-over / Modal Container -->
<div aria-labelledby="slide-over-title" aria-modal="true" class="fixed inset-0 z-50 overflow-hidden" role="dialog">
<div class="absolute inset-0 overflow-hidden">
<div class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10 sm:pl-16">
<!-- Slide-over panel -->
<div class="pointer-events-auto w-screen max-w-md transform transition-transform duration-500 ease-in-out">
<div class="flex h-full flex-col glass-panel rounded-l-2xl shadow-2xl overflow-y-auto">
<!-- Header -->
<div class="px-md py-lg sm:px-lg border-b border-white/40 flex items-center justify-between sticky top-0 bg-surface/80 backdrop-blur-md z-10">
<div>
<h2 class="font-headline-md text-headline-md text-primary" id="slide-over-title">Recognize a Colleague</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Send appreciation and points to a team member.</p>
</div>
<button class="rounded-full p-sm text-on-surface-variant hover:bg-surface-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary" type="button">
<span class="sr-only">Close panel</span>
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Form Content -->
<div class="flex-1 px-md py-lg sm:px-lg">
<form class="space-y-xl">
<!-- Recipient Selection -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="recipient">Recipient</label>
<div class="relative rounded-lg border border-outline-variant bg-surface-container-lowest input-focus-ring transition-all group">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-sm">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary">search</span>
</div>
<input class="block w-full rounded-lg border-0 bg-transparent py-md pl-10 pr-sm font-body-md text-on-surface placeholder:text-outline-variant focus:ring-0" id="recipient" name="recipient" placeholder="Search by name or email..." type="text">
<!-- Mock Dropdown (Hidden by default, shown for UI demonstration) -->
<div class="absolute w-full mt-unit bg-surface rounded-lg border border-outline-variant shadow-lg z-20 overflow-hidden hidden">
<ul class="max-h-48 overflow-y-auto py-unit">
<li class="px-md py-sm hover:bg-primary/5 cursor-pointer flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center font-label-md text-label-md">JD</div>
<div>
<div class="font-body-md text-body-md text-on-surface">Jane Doe</div>
<div class="font-label-md text-label-md text-on-surface-variant">Engineering</div>
</div>
</li>
<li class="px-md py-sm hover:bg-primary/5 cursor-pointer flex items-center gap-sm bg-primary/5">
<div class="w-8 h-8 rounded-full bg-tertiary-container text-on-tertiary-container flex items-center justify-center font-label-md text-label-md">AS</div>
<div>
<div class="font-body-md text-body-md text-on-surface">Alex Smith</div>
<div class="font-label-md text-label-md text-on-surface-variant">Design</div>
</div>
</li>
</ul>
</div>
</div>
<!-- Selected Recipient Chip (Mockup) -->
<div class="mt-md flex flex-wrap gap-sm">
<span class="inline-flex items-center gap-unit rounded-full bg-primary-container/20 px-3 py-1 font-label-md text-label-md text-primary">
                                            Alex Smith
                                            <button class="text-primary hover:text-primary-fixed-dim focus:outline-none" type="button">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</span>
</div>
</div>
<!-- Points Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="points">Points to Award</label>
<div class="relative flex items-center max-w-[200px]">
<button class="absolute left-0 h-full px-sm text-outline hover:text-primary focus:outline-none flex items-center justify-center" type="button">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="block w-full rounded-lg border border-outline-variant bg-surface-container-lowest py-md text-center font-title-lg text-title-lg text-primary focus:border-primary focus:ring-0 input-focus-ring transition-all" id="points" min="0" name="points" step="50" style="-moz-appearance: textfield;" type="number" value="100">
<button class="absolute right-0 h-full px-sm text-outline hover:text-primary focus:outline-none flex items-center justify-center" type="button">
<span class="material-symbols-outlined">add</span>
</button>
</div>
<p class="font-label-md text-label-md text-on-surface-variant mt-sm">Your balance: <span class="font-bold text-on-surface">1,250 pts</span></p>
</div>
<!-- Shoutout Message -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="message">Shoutout Message</label>
<div class="rounded-lg border border-outline-variant bg-surface-container-lowest input-focus-ring overflow-hidden transition-all focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/20">
<!-- Rich Text Toolbar Mockup -->
<div class="flex items-center gap-unit border-b border-outline-variant bg-surface-container px-sm py-unit">
<button aria-label="Bold" class="p-unit text-on-surface-variant hover:bg-surface-variant rounded focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">format_bold</span>
</button>
<button aria-label="Italic" class="p-unit text-on-surface-variant hover:bg-surface-variant rounded focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">format_italic</span>
</button>
<div class="w-px h-4 bg-outline-variant mx-unit"></div>
<button aria-label="List" class="p-unit text-on-surface-variant hover:bg-surface-variant rounded focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">format_list_bulleted</span>
</button>
<button aria-label="Link" class="p-unit text-on-surface-variant hover:bg-surface-variant rounded focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">link</span>
</button>
</div>
<textarea class="block w-full resize-none border-0 bg-transparent p-md font-body-md text-on-surface placeholder:text-outline-variant focus:ring-0" id="message" name="message" placeholder="Write a meaningful message describing why you are giving kudos..." rows="5"></textarea>
</div>
</div>
<!-- Core Value Tags (Optional enhancement) -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm">Tag Core Values</label>
<div class="flex flex-wrap gap-sm">
<button class="inline-flex items-center gap-unit rounded-full border border-outline-variant px-3 py-1 font-label-md text-label-md text-on-surface hover:bg-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[16px] text-tertiary">lightbulb</span> Innovation
                                         </button>
<button class="inline-flex items-center gap-unit rounded-full border border-primary bg-primary/5 px-3 py-1 font-label-md text-label-md text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[16px]">groups</span> Teamwork
                                         </button>
<button class="inline-flex items-center gap-unit rounded-full border border-outline-variant px-3 py-1 font-label-md text-label-md text-on-surface hover:bg-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[16px] text-secondary">trending_up</span> Excellence
                                         </button>
</div>
</div>
</form>
</div>
<!-- Footer Actions -->
<div class="flex flex-shrink-0 justify-end gap-md px-md py-lg border-t border-white/40 bg-surface/80 backdrop-blur-md sticky bottom-0 z-10">
<button class="rounded-lg px-lg py-md font-label-md text-label-md text-primary hover:bg-primary/5 transition-colors focus:outline-none focus:ring-2 focus:ring-primary" type="button">
                                Cancel
                            </button>
<button class="inline-flex items-center justify-center gap-sm rounded-lg bg-primary px-lg py-md font-label-md text-label-md text-on-primary shadow-sm hover:bg-on-primary-fixed-variant transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 active:scale-95 duration-200" type="submit">
<span class="material-symbols-outlined text-[18px]">send</span>
                                Send Kudos
                            </button>
</div>
</div>
</div>
</div>
</div>
</div>
<!-- Material Symbols Setup -->
<script>
        document.querySelectorAll('[data-weight="fill"]').forEach(el => {
            el.style.fontVariationSettings = "'FILL' 1";
        });
    </script>
</body></html>
